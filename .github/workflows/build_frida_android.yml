name: "Build Frida for Android"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android_build:
    env:
      FRIDA_PREFIX: ${{ github.workspace }}/dist
    strategy:
      matrix:
        arch: [x86, x86_64, arm, arm64]
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
    - name: Check out repo
      uses: actions/checkout@main
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup ndk
      id: setup-ndk
      uses: nttld/setup-ndk@main
      with:
        ndk-version: r29
        add-to-path: false

    - name: add ANDROID_NDK_ROOT to environment
      run: |
        echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

    - name: Create temp release
      run: |
        mkdir release-assets

    - name: Get latest Frida version
      id: frida-version
      shell: bash
      run: |
        FRIDA_VERSION=$(curl -fsSL https://api.github.com/repos/frida/frida/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
        echo "FRIDA_VERSION=$FRIDA_VERSION" >> "$GITHUB_ENV"
        echo "version=$FRIDA_VERSION" >> "$GITHUB_OUTPUT"

    - name: Clone frida repository
      shell: bash
      run: |
        git clone \
          --depth 1 \
          --shallow-submodules \
          --recurse-submodules \
          --jobs 4 \
          --branch "$FRIDA_VERSION" \
          https://github.com/frida/frida \
          frida

    - name: Configure
      run: cd frida && >-
          ./configure
          "--prefix=$FRIDA_PREFIX"
          --host=android-${{ matrix.arch }}
          --
          -Dfrida-gum:devkits=gum,gumjs
          -Dfrida-gum:jailbreak=disabled
          -Dfrida-gum:gumpp=disabled
          -Dfrida-gum:gumjs=enabled
          -Dfrida-gum:v8=disabled
          -Dfrida-gum:database=disabled
          -Dfrida-gum:tests=disabled
          -Dfrida-core:devkits=core
          -Dfrida-core:compiler_backend=enabled
          -Dfrida-core:connectivity=disabled
          -Dfrida-core:mapper=enabled
          -Dfrida-core:tests=disabled

    - name: Compile frida 
      run: cd frida && make && make install

    - name: tar core devkit
      run: tar -cJvf "release-assets/frida-core-devkit-${FRIDA_VERSION}-android-${{ matrix.arch }}.tar.xz" -C "$FRIDA_PREFIX/lib/frida-1.0/devkits/core" .

    - name: tar gum devkit
      run: tar -cJvf "release-assets/frida-gum-devkit-${FRIDA_VERSION}-android-${{ matrix.arch }}.tar.xz" -C "$FRIDA_PREFIX/lib/frida-1.0/devkits/gum" .

    - name: tar gumjs devkit
      run: tar -cJvf "release-assets/frida-gumjs-devkit-${FRIDA_VERSION}-android-${{ matrix.arch }}.tar.xz" -C "$FRIDA_PREFIX/lib/frida-1.0/devkits/gumjs" .

    - name: tar frida-inject
      run: tar -cJvf "release-assets/frida-inject-${FRIDA_VERSION}-android-${{ matrix.arch }}.tar.xz" -C "$FRIDA_PREFIX/bin" frida-inject

    - name: tar frida-server
      run: tar -cJvf "release-assets/frida-server-${FRIDA_VERSION}-android-${{ matrix.arch }}.tar.xz" -C "$FRIDA_PREFIX/bin" frida-server

    - name: tar 32-bit frida-gadget
      if: ${{ !contains(matrix.arch, '64') }}
      run: tar -cJvf "release-assets/frida-gadget-${FRIDA_VERSION}-android-${{ matrix.arch }}.tar.xz" -C "$FRIDA_PREFIX/lib/frida-1.0/32" frida-gadget.so

    - name: tar 64-bit frida-gadget
      if: ${{ contains(matrix.arch, '64') }}
      run: tar -cJvf "release-assets/frida-gadget-${FRIDA_VERSION}-android-${{ matrix.arch }}.tar.xz" -C "$FRIDA_PREFIX/lib/frida-1.0/64" frida-gadget.so

    - name: Create release frida ${{ matrix.arch }}
      uses: ncipollo/release-action@main
      with:
        tag: ${{ steps.frida-version.outputs.version }}
        name: "Frida ${{ steps.frida-version.outputs.version }}"
        allowUpdates: true
        artifacts: release-assets/*
